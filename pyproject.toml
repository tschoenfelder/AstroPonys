[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "astroponys"
version = "0.1.0.dev0"
description = "Small, reproducible tools for evidence-oriented FITS analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thomas Schoenfelder" }]
dependencies = [
  "astropy>=7.0,<8",
  "numpy>=2.1,<3",
  "Pillow>=11,<13",
  "PyYAML>=6.0.2,<7",
  "scipy>=1.15,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
astroponys = "astroponys.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requirement(id): link a behavioural test to a requirement"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["astropy.*", "scipy.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/astroponys"]
