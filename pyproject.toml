[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "astroponys"
version = "0.0.0"
description = "Small, reproducible tools for evidence-oriented FITS analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thomas Schoenfelder" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requirement(id): link a behavioural test to a requirement"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
