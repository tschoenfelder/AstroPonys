name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-primary:
    name: Windows / Python 3.13 primary gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install binary dependencies and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: ".[dev]"
      - run: python -m pytest --cov=astroponys --cov-report=term-missing
      - run: python -m astroponys.quality.traceability .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: python -m astroponys.quality.traceability .
